; RiotFix - The Suffering / The Suffering: Ties That Bind
; With an .asi loader: RiotFix.asi + RiotFix.ini in the folder where the loader looks for .asi files.
; Without one: dinput8.dll + RiotFix.ini in the exe folder. Every run writes RiotFix.log.

[Shadows]
; Shadow texture size per character (original 256; 128 to 2048, a power of 2). Tested: 1024 in the first game.
Resolution=512
; Multiplies the distance at which shadows fade out (original 1.0).
DistanceScale=1.0
; Who casts shadows: 0 = menu option; 1 = player only; 2 = characters; 3 = everything.
; (Shadows turned off in the menu stay off.)
Casters=0
; Minimum shadow light angle in degrees. The game raises any lower light to 45, so shadows stay short.
; Lower (e.g. 25) = longer shadows in the real light direction. 45 = original; 5 to 85.
MinAngle=45

[LOD]
; Multiplies the distance at which characters and objects switch to the simpler mesh.
; 1.0 = original; 2.0 = twice the distance; 0 = always the full mesh.
DistanceScale=1.0

[Draw]
; First game only: multiplies the object draw distance (0 = leave unchanged).
CullDistanceMultiplier=0
; 1 = every portal is kept open, so the engine's zone culling never hides what lies beyond one.
; The engine culls with zones joined by portals: a camera zone starts with the whole screen, a link through an open
; portal passes that window clipped to the portal's screen rectangle, and a piece of the level is drawn when its zone
; was reached. A closed portal stops the walk, so everything past it goes undrawn. Shut doors are already handled -
; a door opens its portal as it starts to swing, so the room behind an ajar door is never hidden - but a shut barred
; gate is a closed portal you can see straight through, and the levels' hand-written visibility lists only patch some
; of those. Measured in 1a PrisonDeathRow: a cell's list holds 11 of that level's 83 zones, all inside death row, so
; from a cell or at its gate the main hall exists only through an open portal; stepping about makes whole rooms
; appear and vanish behind the bars. This puts the engine's own "open" handler in the table slot its "close" handler
; sits in, so every request to close a portal opens it instead, through the engine's own code. Forcing a solid door's
; portal open costs drawing but shows nothing wrong, since the door itself still blocks the view; the cost is the
; engine drawing more of the level, which is what the zones were for on a 2004 PC. Not tested yet, so it is off.
OpenAllPortals=0

[Memory]
; Budget in MB of each resource cache. When a cache is full the game unloads and reloads resources, which costs
; time and, with large shadows, exposed crashes in the loader. 0 = original. Values below the original are refused.
; Larger budgets keep more resources loaded: more RAM and video memory, and more of the 2 GB the game can address.
; Originals: Model 10, Texture 15, Animation 6, Sound 30, Sequence 0.0625 (TTB 0.125), String 0.0195,
; Lighting 1, Waveform 0.0625, Font 0.0098, ScreenSet 0.1514 (TTB only).
; Each level also sets its own Texture, Model, Animation and Lighting budgets (Level Properties), usually lower
; than the originals; a configured budget here is kept whenever a level asks for less.
Model=0
Texture=0
Animation=0
Sound=0
Sequence=0
String=0
Lighting=0
Waveform=0
Font=0
ScreenSet=0
; 1 = logs every new peak of each cache's usage (to choose the budgets from real numbers).
LogUsage=0

[System]
; 1 = skip the start-up logo movie.
SkipIntro=1

[Display]
; Refresh rate asked for in full screen, in Hz (20 to 1000). The game asks for whatever rate its mode list gave it,
; and on a screen that offers several for the same resolution that is not always the one you want. Windowed modes are
; not touched. The log says what the game asked and what was put in its place. 0 = the game's own choice.
RefreshRate=0

[Shader]
; The pixel shader the scene is drawn through. These settings used to live in [Display]; an .ini that
; still has them there keeps working, and the log says so once. The Suffering only.

; 1 = draw the picture in black and white, through the shader the game itself carries. This is not a filter of
; RiotFix's own: the engine loads a black-and-white pixel shader every run and draws the whole frame with it
; when one field is set, which on the console is the Murnau Mode cheat. That cheat is a controller button
; sequence the PC build never had a controller for, so the shader has been sitting there unused since release.
; The Suffering only; the field has not been measured in Ties That Bind.
BlackAndWhite=0

; 1 = draw the scene through a colour shader of RiotFix's own, instead of the black-and-white one. Nothing is
; added to the game: the engine reads its pixel shaders as text and assembles them itself every run, so RiotFix
; writes a source of its own to the temporary folder, hands it to the game's own compiler, and puts the result
; in the slot the black-and-white shader uses. It covers the world and leaves the heads-up display alone,
; because that slot sits on the scene and not on the finished picture. The Suffering only. Cannot be used
; together with BlackAndWhite, which is the same slot.
ColourGrading=0
; How much colour, with 1.0 leaving it as the game has it, 0.0 giving grey and 2.0 twice as vivid. The grey it
; mixes towards is the game's own, the NTSC luminance the black-and-white shader uses. 0.0 to 2.0.
Saturation=1.0
; Contrast around the middle grey, with 1.0 leaving it alone. 0.5 to 2.0.
Contrast=1.0
; 1 = squeeze the finished picture into the 16-235 range a console sends to a television. A television opens
; that range back up; a PC monitor does not, which is a good part of why the same game looks flatter here than
; it does on a console through a TV. This is about the display chain rather than taste, so it is its own
; switch: turn it on if you are chasing the console's look, leave it off otherwise.
ConsoleRange=0
; A shader of your own, instead of the one RiotFix writes from the two settings above. Give just a file name
; and it is looked for in a CustomShader folder beside the game, which is the tidy place for it and also the
; simplest: the engine resolves shader names against its own folder, so nothing has to climb out of it. An
; absolute path works too. The game assembles the text itself, every run, so changing a shader is an edit and
; a relaunch rather than a new build. Leave empty to use Saturation and Contrast.
ShaderFile=
; A key that reloads the scene shader while the game is running, given as a Windows virtual-key number: 121 is
; F10, 122 is F11, 123 is F12. Edit the .psh in a text editor, tap the key, and the change is on screen - the
; engine assembles it again with its own code, the same way it does at startup. It reloads every shader the
; game has, not only ours, and the handles it replaces are not freed, so a long tuning session leaks a little;
; harmless, but it is why this is off unless you ask for it. 0 = off.
ShaderReloadKey=0

[Widescreen]
; 1 = wide screens show more at the sides (Hor+) instead of losing picture at the top and bottom.
Enable=1
; Horizontal field of view of the third-person camera, in degrees (30 to 170). 0 = the one the level asks for,
; widened by Enable. In The Suffering this is also the first-person angle: the game uses one angle for both
; cameras. Cutscenes and the camera's own movements (aiming, running) are not touched. Needs Enable=1.
ThirdPersonFieldOfView=0
; Horizontal field of view of the first-person view, which Ties That Bind sets apart from the camera above.
; 0 = the game's. Needs Enable=1. In The Suffering it does nothing: use the option above.
FirstPersonFieldOfView=0
;
; Choosing a number. It is the horizontal angle on your screen, so it depends on the screen's shape, not on the
; resolution: 1920x1080 and 1280x720 take the same value. These are the angles the games themselves use, on a 4:3
; screen, and what Enable=1 turns them into (what you already get with 0):
;
;                           4:3     16:10    16:9     21:9
;   The Suffering            67       77       83       99      (one angle for both cameras)
;   Ties That Bind, 3rd      69       79       85      100
;   Ties That Bind, 1st      79       89       95      110
;
; So, to keep the game's original framing on a wide screen, use the 4:3 column (The Suffering 67, Ties That Bind 69
; and 79). Larger numbers show more and make the hands and weapons smaller; smaller numbers bring them closer and
; can cut the weapon off the screen edge.
;
; For any other shape: tan(angle / 2) = tan(angle in the 4:3 column / 2) x (width / height) / 1.3333
; with the angles in degrees. LogCameras=1 writes the angle in use in the log, as
; "[camera] renderer camera 0 (...): lens ..., horizontal X deg", so you can check what a number really gave you.
; 1 = HUD elements keep their 4:3 size and stick to their side of the screen; menus stay in a centred 4:3 box.
Hud=1
; How much of the screen height the picture of a note, a photo or a map takes on the archive screen. The game draws
; it tile by tile at the size of its own texture in pixels, so it keeps the size it was made for (around 640x480) at
; every resolution and takes less and less of the screen as the resolution grows: the same photo measures 508 pixels
; tall at 1024x768 and at 1920x1080, which is 66% of the screen height in the first and 47% in the second. Notes
; cannot be zoomed at all (the level marks only maps as zoomable), so at 1080p and above they cannot be read.
; 0.84 is what the console versions show. 0 = the game's own size. Pictures are never made smaller, only larger.
; This also keeps the picture's shape: with Hud=1 the 4:3 menu box divides the width of everything it places, which
; is right for what is laid out in fractions of the screen, but this picture's size is in pixels and came out 0.75
; as wide as it should be. It needs Hud=1 or an interface size only to place the rest of the screen; the picture
; itself is fixed either way.
ArchiveScale=0.84
OriginalCutsceneFraming=1
; 1 = the black bars of cutscenes are drawn (original), 0 = no bars.
CutsceneBars=1

[Accessibility]
; Size of the interface during play: 1 = the game's, up to 3. Each HUD element grows away from its corner or side,
; the crosshair stays in the middle, and the mouse cursor grows with it. Menus keep their size.
InterfaceScale=1
; 1 = text gets an even outline around its letters (the subtitles' shadow becomes the outline).
Outline=1
; Outline thickness in pixels at 1080p (scaled with the screen height).
OutlineSize=2
; Outline colour, RRGGBB in hexadecimal.
OutlineColor=000000
; 1 = keep the game's shadow under the outline too.
OutlineShadow=0
; 1 = every text gets the outline (HUD, items, menus); 0 = only text that the game draws with a shadow (subtitles).
OutlineAll=1
; Fonts drawn without an outline: their resource ids in hexadecimal, separated by spaces ([Debug] LogHud=1 logs the
; id of every font as "[font] ... id XXXXXXXX"). 00050003 = the menus' hand-drawn font (both games).
OutlineSkipFonts=00050003

[Window]
; 1 = in windowed mode the window has no border and no title bar, keeps the size of the chosen resolution and is
; centred on the screen (with the desktop's resolution chosen, that is a borderless full screen). 0 = the game's
; window. Full screen is not touched.
Borderless=1
; 1 = the mouse cursor is held inside the window while the game has the focus, and freed when it loses it.
ConfineCursor=1
; 1 = Windows' own cursor is hidden over the window while the game has the focus (the game draws its own in menus).
HideCursor=1
; 1 = with the window inactive the game sleeps between frames instead of using a whole processor core.
IdleWhenInactive=1
; Text of the window's title bar and of its button in the taskbar. Empty = the game's own (The Suffering leaves it
; blank).
Title=
; 1 = the version is added after the game's name in the title bar and in the taskbar button, as
; "The Suffering - RiotFix 0.1.0", so a window says which RiotFix it is running. With an empty Title above, the
; game's own name is used as the start of it.
ShowVersion=1

[Audio]
; Reverb on the 3D sounds, which the PC version never asks for: the engine knows the DirectSound reverb and has the
; code to use it, but no level turns it on, so every sound is dry. Here it is put on by RiotFix, with one of the
; environments below, on every 3D sound long enough to take one (DirectSound needs 150 ms, so short sounds stay dry).
; It costs processor: one effect per sound playing. off = the game as it is.
;   off  generic  room  paddedcell  bathroom  stoneroom  hallway  stonecorridor  cave  hangar  arena  sewerpipe
;   alley  forest  city  underwater
; For a prison, stonecorridor or hallway are the closest to the console versions. It is one environment for the whole
; game, though, not one per room: the console versions change theirs as you walk from a cell to a yard, and this one
; does not, so every open space sounds like the environment you picked. That is why it is off unless you ask for it.
; The effect itself belongs to Windows, not to the game, and the engine asks for the I3DL2 reverb. On Windows 11 that
; one class is no longer registered, while the other effects of the same dsdmo.dll (Waves reverb, gargle, echo) still
; are, so the game's own reverb could not work there even without RiotFix. When the I3DL2 reverb is missing, RiotFix
; falls back to the Waves reverb and carries the environment over by the two values both effects share, how loud the
; reverb is and how long it takes to die away: close, not identical. RiotFix.log says which one was used.
Reverb=off
; How loud the reverb is, in hundredths of a decibel below the dry sound: 0 is as loud as the sound itself, -1000 is
; a tenth of it, -10000 is silence. Empty = the environment's own level.
;ReverbLevel=-1000
; Which sounds get it: 3d = only the sounds the game places in the world (the default); all = the 2D sounds too,
; except the long ones (five seconds or more), which are the music and the streamed tracks.
ReverbSounds=3d
; 1 = sounds too short for an effect (DirectSound needs 150 ms) are given a longer buffer with silence at the end,
; so they can take the reverb too. A sound the game plays in a loop then loops through that silence, which is why
; this is off by default.
ReverbShortSounds=0
; A key (F1 to F12) that walks through the environments above while you play, so you can hear them one after the
; other and pick one. Each press writes the environment's name in RiotFix.log. Sounds already playing keep the one
; they were made with; the next ones take the new one. Empty = no key.
ReverbCycleKey=

[Timing]
; Most frames per second the game is allowed to draw. The games misbehave above 60 (the physics and some animations
; follow the frame time with no cap of their own), so 60 is the default. 0 = no limit. If the picture stutters with
; the game's vertical sync on, try one frame less than your screen's rate (59 on a 60 Hz screen).
MaxFrameRate=60

[Debug]
; 1 = write RiotFix.log and, if the game ever crashes, a RiotFix.dmp beside it. This is what a bug report needs
; (see Docs/Reporting.md), it costs almost nothing while playing, and the log is the only way to tell one build
; from another. Leave it on unless you have a reason not to.
CrashLog=1

; 1 = once the game is up, write every string the engine will hand out for ids 0 to 0x200, with the bytes in hex
; beside the text. This is how the name of a controller input is matched to the string the game shows: on the
; console some of those names are not words but a single character the font draws as a button icon, and only the
; hex shows which. Writes a few hundred lines and then stops; leave it at 0 for normal play.
DumpStrings=0
; The size in bytes of one sound, as SurrealEd reports it in the Audio tab. Everything that happens to a buffer of
; exactly that size is written to the log with no line limit: when it is made, every time it is told to play, every
; volume set on it and every stop. It tells a sound that is never played apart from one that is played at silence.
; Up to eight sizes, separated by commas. Empty = off.
;WatchSound=62462,66574,60510
; 1 = logs the first calls of each patch.
Trace=0
; 1 = the crash dump holds the whole of the game's memory instead of only the stacks and the writable data. The
; ordinary dump is a few megabytes and is enough to see where a crash happened; what it leaves out is the read-only
; data, and that is where every class's table of methods lives, so a crash cannot be followed from an object to the
; code that was about to run. Turn this on when a crash has to be explained rather than only located. The file grows
; to the size of the game's memory, a few hundred megabytes, and is overwritten by the next crash.
FullCrashDump=0
; 1 = measures the text the engine puts on a screen as it arrives, and reports any string long enough to fill the
; stack buffer it travels in. That buffer sits 0x200 bytes below its frame's return address and is filled by a
; look-up capped at 0x100 wide characters, so a longer string walks over the return address - which is what the
; crash dumps of 0.4.x show. This says whether that is what happens, and with which text.
WatchScreenText=0
; 1 = logs every field of view the game sets on its cameras (degrees and the chain of callers) and every lens change.
LogCameras=0
; 1 = logs every sound buffer the game creates (size, format and flags) and every effect it tries to put on one,
; with what DirectSound answered. The reverb of both games is the standard DirectSound effect, and DirectSound only
; accepts effects on buffers of at least 150 ms that are not in hardware, so this says which sounds come out dry.
LogAudio=0
; 1 = no line limits on the audio log: every sound of the session is written, however long it runs. LogAudio keeps
; limits of its own (400 buffers, 120 plays, 120 volumes, 60 3D placings, 15 cuts) so a long session does not fill
; the log with the same few sounds, but a limit reached in the middle of a hunt loses exactly the line that
; mattered and says nothing about it. Turn this on while chasing a sound that sometimes does not play. It turns
; LogAudio on by itself. The log gets large: name the sounds afterwards with Scripts/NameSounds.py.
LogAllSounds=0
; 1 = logs each new chain of callers that draws 2D (HUD, text, menus), to find the code that draws text.
LogHud=0
; 1 = logs the mouse readings of every poll with movement (raw counts, sums, time and the values the game uses).
LogMouse=0
; 1 = every action the engine asks its input manager about is written to the log: one line the first time it is
; asked at all, whatever the answer, and one more every time the answer changes. So an action that exists but is
; not pressed still shows up, and holding a key writes one line instead of one a frame. The ids are the numbers
; in each game's binding table; pressing each key and button in turn names the real id of each. Read-only.
LogActions=0
; 1 = writes out, once, what the engine itself holds about input: the key bindings in force (every record, with the
; action, the device, the key or button and the range the engine maps it through), the fields it keeps for each
; input device, and each input of each device the first time it reads anything. This is what the native controller
; support is being built on (Docs/PadPort.md), and the one-off lines it writes are the measurements that decide the
; design. Read-only; it changes nothing in the game.
LogBindings=0
; 1 = how the game reads the keyboard is written to the log: whether it takes the whole state each frame or a queue
; of events, and the scan code of every key that goes down or up (up to 500 lines). The engine asks about a button
; action only once one of its keys is down, so a controller's buttons have to reach the game as keys, and this is
; how to see where to put them. Only works with RiotFix as dinput8.dll. Read-only.
LogKeyboard=0
; 1 = logs which code reads each input axis (actions, mode and value), the first 3 times per caller.
LogAxes=0

[Controller]
; 1 = the controller is given to the game as an input device of its own, beside the keyboard and the mouse, which is
; how the console versions read it: the engine itself then works out presses, releases, holds, analog values and
; rumble. The PC build kept all of that and only dropped the device, so this puts the device back. It is being built
; in stages (Docs/PadPort.md): at this one the device is there and reports the sticks and buttons, but nothing is
; bound to it yet, so the game plays exactly as it did and the option changes nothing you can feel. [Debug]
; LogBindings shows what the engine made of it. 0 = the device is not added at all.
NativeDevice=1
; 0 = the pad is still added as a device of the engine and still reports its sticks and buttons, but no binding
; record is installed, so no action answers to it. That is the port as it stood before records existed, and it
; separates the two halves of it: a fault that survives this comes from the device being there at all, and one
; that does not comes from what is bound.
Bindings=1
; Which groups of bindings are installed, added together: 1 walking forward and back, 2 the camera, 4 the action
; buttons, 8 what every layout shares (menu, pause, map, d-pad), 16 strafing and turning. 31 is all of them and is
; what the port installs. This is for narrowing a fault down to the group that causes it, one group at a time.
BindGroups=31
; 1 = corrects a fault in the game itself. A hint such as "press <Use> to open" is expanded by collecting, for
; each device, the keys bound to the action - and the array that holds one list per device is built for two, the
; keyboard and the mouse, because the PC build never had a third. With the controller added as a device of its
; own it is the third, and the expander reads one element past that array and writes an input code through
; whatever it finds. A hint naming an action pair, such as <LadderMove> on the crank handles, then crashes the
; game. The fix changes two bytes of one test so it refuses any device the array has no room for, which is what
; the test was already there to do for -1. Hints name the keyboard, as they did before the pad existed. 0 leaves
; the game as it is, and the crash with it.
FixHintDeviceList=1
; 1 = the pad is listed with the engine's rumble mixer. The mixer runs every frame and shakes every device named
; in a short list the input manager keeps, but nothing in the PC build ever puts a device there - which is why
; this version of the game has no rumble at all, with or without a patch. The pad adds itself, and the strength
; comes from the game's own mixer at the ceiling the console used. The engine empties that list when it resets,
; so it is put back each frame.
Rumble=1
; 1 = pushing the move stick part way walks, and pushing it all the way runs, as it does on the console. The
; engine already works this way for the keyboard: the player's speed is one minus the value of its walk action,
; and the pad simply answers that action with how far short of the edge the stick is. At rest it answers zero, so
; the keyboard's own walk key still decides when nobody is touching the stick. 0 makes the stick always run.
AnalogWalk=1
; 255 = each row keeps its own input. Any other value gives every row that input code instead, which is how a
; fault that follows the code rather than the row is caught. Only 0 to 26 are real inputs; anything above is
; ignored by the engine, so the rows go dead instead of changing.
ForceCode=255
; 1 = a connected controller drives the game. The pad is read through SDL3, so SDL3.dll must sit beside RiotFix.
; The engine asks its input manager what one action is doing and gets a number back; RiotFix answers that question
; with the pad's state when the pad is pushing harder than the keyboard, so both work at once and the game's own
; menus, help text and key bindings are untouched. The action ids were measured with [Debug] LogActions, not taken
; from the binding table: the four movement ids are not in that table at all, because the console build's Move rows
; were dropped from the PC one.
; Which of the five layouts the console versions offered is used. The PC data still carries that screen and the
; five names but not the button tables, so these were read off the PS2 build's own Controller Settings screen:
;   doublestick            the console default: R1 attack, R2 jump, L1 throw, L2 reload, cross use,
;                          circle use health, square first person, triangle insanity
;   doublestickflashlight  the same, plus the right stick's click for the flashlight
;   throwjumpswap          L1 jump, R2 throw, L2 first person, square reload
;   jumpontop              cross jump, square use, circle reload, L2 use health, R2 first person
;   singlestick            one stick steers; L2 and R2 strafe, R1 insanity, square attack
; The Xbox version's own five are here too, under the same names with "xbox" in front: xboxdoublestick,
; xboxdoublestickflashlight, xboxthrowjumpswap, xboxjumpontop and xboxsinglestick. They are read out of that
; version's executable, and they are not the PS2's: the Xbox puts jump on A and attack on the right trigger, where
; the PS2 puts use on cross and attack on R1. Its Black and White buttons land on L1 and R1 of a modern pad.
; On every layout: select opens the map, start pauses, d-pad left / right change weapon, d-pad up / down change
; the thrown weapon. In menus: cross accepts, triangle or circle goes back, the d-pad and the left stick move
; between the items, as on the console. The mouse cursor is hidden while the controller is the last thing used,
; and comes back as soon as the mouse moves.
Layout=doublestick
Enable=1
; How far the stick must move before it counts, of 32767. Raise it if the character drifts with the stick centred.
DeadZone=6000
; How fast the right stick turns the view. The engine's own numbers for the mouse run well past 1, so this scales
; the stick to match. Raise to turn faster.
LookSpeed=2.0
; The log names which action ids exist but not what each one means, so these four switches settle what measurement
; could not. If the character walks sideways when you push forward, set SwapSticks=1. If a direction is backwards,
; invert that one. Between them they cover every way the two sticks can be wired up.
SwapSticks=0
InvertMoveX=0
InvertMoveY=0
InvertLookX=0
InvertLookY=0

[Testing]
; Not settings. Each of these was added to answer a question, and each comment keeps what the answer was,
; which is why they are here rather than deleted. Leave them alone unless you are chasing the same question.

; 1 = cutscenes keep the framing they were made with: during a cutscene the field of view goes back to the game's,
; so a wide screen does not show more at the sides. What it loses instead is the top and the bottom, where the
; cutscene's black bars already are. 0 = cutscenes are widened like the rest of the game.
; Experimental. The camera carries two lenses: one the horizontal angle comes from, one the vertical. Widescreen
; widens only the horizontal, which is what Hor+ means, and the picture is right. But something that decides what is
; worth drawing may be reading the other one, which would explain objects near the left and right edges appearing
; only once the camera turns. With this on the second lens is widened too. Watch for two things: whether the popping
; at the edges stops, and whether the view also grows taller, which would mean the picture itself changed.
; The first build of this scaled the second lens only when the lens constant changed, so the engine overwrote it
; from the angle within a frame or two: the option could not have worked, and the test that said it did not
; help proved nothing. It now scales the lens right after the engine works it out, on every change of angle.
; Whether the culling really reads that lens is still unproven - this is the test. Set it to 1 to try it.
;WidenCulling=1

; 1 = let The Suffering ask for reverb by itself. It carries the whole path — buffer with DSBCAPS_CTRLFX,
; CoInitialize, SetFX with the I3DL2 class — and a box for it in the configuration screen, but its sound system
; clears the flag that opens that path, in its own constructor, without ever reading the box. Ties That Bind reads
; the box in the same place, which is the only difference between the two. With this on, the levels' own Reverb
; Effect Templates play, changing by room as the level asks, instead of the one preset below. Surreal disabled this
; deliberately, and testing says they were right: the path runs and every call succeeds (802 of 802 in one session,
; no failure and no crash), but what comes out does not sound good. Left here because it answers the question and
; may yet be worth tuning; the preset below is the one to use in this game.
; Needs "Enable EAX (Environmental Audio)" ticked in the game's configuration screen. The Suffering only.
;EngineReverb=1

; 1 = let The Suffering ask for reverb by itself. It carries the whole path — buffer with DSBCAPS_CTRLFX,
; CoInitialize, SetFX with the I3DL2 class — and a box for it in the configuration screen, but its sound system
; clears the flag that opens that path, in its own constructor, without ever reading the box. Ties That Bind reads
; the box in the same place, which is the only difference between the two. With this on, the levels' own Reverb
; Effect Templates play, changing by room as the level asks, instead of the one preset below. Surreal disabled this
; deliberately, and testing says they were right: the path runs and every call succeeds (802 of 802 in one session,
; no failure and no crash), but what comes out does not sound good. Left here because it answers the question and
; may yet be worth tuning; the preset below is the one to use in this game.
; Needs "Enable EAX (Environmental Audio)" ticked in the game's configuration screen. The Suffering only.
;EngineReverb=1
; A test, not a fix: the lowest volume the engine is allowed to set, in hundredths of a decibel (-2000 is a fifth of
; full, -10000 is silence). DirectSound is given distances of a thousand million units, so it attenuates nothing and
; the engine works out loudness itself, writing -10000 for anything it places too far away. Raising the floor makes
; those audible, which says whether a sound you cannot hear was silenced on purpose or never reached the output at
; all. Everything distant will be far too loud while this is on. Empty or 0 = the game as it is.
;VolumeFloor=-2000

; 0 = the controller is left without two of its menu bindings: going into an item (the keyboard's Enter) and
; scrolling a long list with the right stick (the mouse's wheel). It takes the pad's rows back to the 33 that
; 0.3.7 had. This is a test: a crash in the engine's screen drawing appeared with those four rows, and turning
; them off says whether the number of bindings is what the engine cannot take.
MenuExtras=1

; 1 = the pad's rows are put after the game's table instead of inside each action's first group. The engine reads
; only an action's first group, so most rows then answer to nothing - this is a test, not a setting. It separates
; "the engine reads our row" from "our row exists".
AppendRows=0

; Overrides the name the game shows for the controller's inputs, for testing only. RiotFix already knows the
; right numbers: each input's name is an index into an array the string manager keeps, and the controller's
; block was measured in the running game - 0x05 is "START button", 0x17 "L1 button", 0x07 "left analog stick
; up", and so on. Setting this to anything but 65535 throws those away and numbers the inputs from here
; upwards instead, which shows wrong words on purpose. Leave it at 65535.
NameStringId=65535
